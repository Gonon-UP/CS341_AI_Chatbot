<!DOCTYPE html>
<html lang="en">

<!-- INITIAL DEVELOPMENT OF WEBSITE -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Name of browser and necessary .css file -->
    <title>Research Chatbot</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/sourcePopup.css">
    <link rel="stylesheet" href="stylesheets/documentPopup.css">

    <!-- Google itentity services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Container to separate Title and Row (where element are displayed) -->
    <div class="page">
        <div class="title-container">
            <textarea class="title" id="titleArea" placeholder="Notebook Title"
                      maxlength="50" rows="1"></textarea>

            <button class="custom-button" id="newPageButton">New Page</button>
        </div>

        <!-- Displays 3 sections (left, middle, right columns)
             with 25%, 50%, 25% of page width, respectively -->
        <div class="row">
            <!-- Left column for Sources and Previous Meetings -->
            <div class="left-container">
                <div class="child">
                    <div class="child-header">Sources</div>

                    <div class="child-content" id="sourcesPanel">
                        <button class="custom-button" onclick="addSources()">+ Add Web Sources</button>
                        <div id="sourcesList" class="custom-list"></div>

                        <!-- Replace Google Drive with Document Upload -->
                        <button class="custom-button" onclick="addDocuments()">↑</button>
                    </div>
                </div>

                <div class="child">
                    <div class="child-header">Previous Meetings</div>

                    <div class="child-content" id="meetingsPanel">
			   <div id="pagesList" class="custom-list"></div>
		    </div>
                </div>
            </div>

            <!-- Middle column for ChatBot -->
            <div class="chatbot-container">
                <div class="child">
                    <div class="child-header">Chatbot</div>

                    <div class="chatbot-content">
                        <!-- Where the texts back and forth go -->
                        <div class="message-area" id="messageArea"></div>

                        <!-- Contains the text box and send button -->
                        <div class="input-container">
                            <textarea class="text-box" id="textBox" placeholder="Ask a question..." rows="1"></textarea>

                            <button id="sendButton" class="custom-button" onclick="sendMessage()">→</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right column for Topics and Upcoming Tasks -->
            <div class="right-container">
                <div class="child">
                    <div class="child-header">Topics</div>

                    <div class="child-content" id="topicsPanel">
                        <div id="topicsList" class="custom-list"></div>
                    </div>
                </div>

                <div class="child">
                    <div class="child-header">Upcoming Tasks</div>
                    
                    <div class="child-content" id="tasksPanel"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- DOCUMENT UPLOAD MODAL -->
    <div id="uploadModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h2>Upload Document</h2>
            
            <form id="uploadForm">
                <input type="hidden" id="pageId" name="pageId" value="">
                
                <div class="form-group">
                    <label for="documentInput">Select File:</label>
                    <input 
                        type="file" 
                        id="documentInput" 
                        name="document" 
                        accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx" 
                        required
                    >
                    <small>Max 50MB. Accepted: PDF, Word, Excel, PowerPoint, Text</small>
                </div>

                <div id="uploadProgress" class="progress-container" style="display: none;">
                    <div class="progress-bar-bg">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="progressText">0%</p>
                </div>

                <div id="uploadMessage" class="upload-message" style="display: none;"></div>

                <div class="button-group">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="uploadBtn" class="btn btn-primary">Upload</button>
                </div>
            </form>

            <div class="documents-list">
                <h3>Uploaded Documents:</h3>
                <ul id="documentsUL"></ul>
            </div>
        </div>
    </div>
</body>

<!-- JavaScript files (separate scripts for popups) -->
<script type="module" src="javascripts/mainScript.js"></script>

<div id="sourcesPopup" class="popup-overlay">
    <iframe
        id="popupFrame1"
        src=""
        frameborder="0"
        style="width: 420px; height: 260px; border-radius: 16px; background: white;">
    </iframe>
</div>

<div id="documentPopup" class="popup-overlay">
    <iframe
        id="popupFrame2"
        src=""
        frameborder="0"
        style="width: 420px; height: 260px; border-radius: 16px; background: white;">
    </iframe>
</div>

</html>
