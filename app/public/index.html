<!DOCTYPE html>
<html lang="en">

<!-- INITIAL DEVELOPMENT OF WEBSITE -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Name of browser and necessary .css file -->
    <title>Research Chatbot</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/sourcePopup.css">
    <link rel="stylesheet" href="stylesheets/documentPopup.css">
</head>

<body>
    <!-- Container to separate Title and Row (where element are displayed) -->
    <div class="page">
        <div class="title-container">
            <textarea class="title" id="titleArea" placeholder="Notebook Title" maxlength="50" rows="1"></textarea>

            <button class="custom-button" id="newPageButton">New Page</button>
        </div>

        <!-- Displays 3 sections (left, middle, right columns)
             with 25%, 50%, 25% of page width, respectively -->
        <div class="row">
            <!-- Left column for Sources and Previous Meetings -->
            <div class="left-container">
                <div class="child">
                    <div class="child-header">Sources</div>

                    <div class="child-content" id="sourcesPanel">
                        <!-- Upload Sources and Files buttons -->
                        <div class="sources-controls">
                            <button class="custom-button" onclick="addSources()">+ Add Web Sources</button>
                            <button class="custom-button" id="files-button" onclick="addDocuments()">↑</button>
                        </div>

                        <div id="sourcesList" class="custom-list"></div>
                    </div>
                </div>

                <div class="child">
                    <div class="child-header">Previous Meetings</div>

                    <div class="child-content" id="meetingsPanel">
                        <div id="pagesList" class="custom-list"></div>
                    </div>
                </div>
            </div>

            <!-- Middle column for ChatBot -->
            <div class="chatbot-container">
                <div class="child">
                    <div class="child-header">Chatbot</div>

                    <div class="chatbot-content">
                        <!-- Where the texts back and forth go -->
                        <div class="message-area" id="messageArea"></div>

                        <!-- Contains the text box and send button -->
                        <div class="input-container">
                            <textarea class="text-box" id="textBox" placeholder="Ask a question..." rows="1"></textarea>

                            <button id="sendButton" class="custom-button" onclick="sendMessage()">→</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right column for Topics and Upcoming Tasks -->
            <div class="right-container">
                <div class="child">
                    <div class="child-header">Topics</div>

                    <div class="child-content" id="topicsPanel">
                        <div id="topicsList" class="custom-list"></div>
                    </div>
                </div>

                <div class="child">
                    <div class="child-header">Upcoming Tasks</div>

                    <div class="child-content" id="tasksPanel"></div>
                </div>
            </div>
        </div>
    </div>
</body>

<!-- JavaScript files (separate scripts for popups) -->
<script type="module" src="javascripts/mainScript.js"></script>

<!-- Sources Popup, used to search and display the search results -->
<div id="sourcesPopup" class="popup-overlay">
    <iframe id="popupFrame1" src="" frameborder="0"
        style="width: 420px; height: 260px; border-radius: 16px; background: white;">
    </iframe>
</div>

<!-- Documents Popup, allows the user to upload a document -->
<div id="documentsPopup" class="popup-overlay">
    <iframe id="popupFrame2" src="" frameborder="0"
        style="width: 420px; height: 260px; border-radius: 16px; background: white;">
    </iframe>
</div>

</html>
