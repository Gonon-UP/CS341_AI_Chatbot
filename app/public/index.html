<!DOCTYPE html>
<html lang="en">

<!-- INITIAL DEVELOPMENT OF WEBSITE -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Name of browser and necesary .css file -->
    <title>Research Chatbot</title>
    <link rel="stylesheet" href="stylesheets/style.css">
</head>

<body>
    <!-- Container to separate Title and Row (where element are displayed) -->
    <div class="page">
        <div class="title">Notebook Title</div>

        <!-- Displays 3 sections (left, middle, right columns)
             with 25%, 50%, 25% of page width, respectively -->
        <div class="row">
            <!-- Left column for Sources and Previous Meetings -->
            <div class="left-container">
                <div class="child">
                    <div class="child-header">Sources</div>
                    <div class="child-content"></div>
                </div>

                <div class="child">
                    <div class="child-header">Previous Meetings</div>
                    <div class="child-content"></div>
                </div>
            </div>

            <!-- Middle column for ChatBot -->
            <div class="chatbot-container">
                <div class="child">
                    <div class="child-header">Chatbot</div>

                    <div class="child-content">
                        <!-- Where the texts back and forth go -->
                        <div class="message-area" id="messageArea"></div>

                        <!-- Contains the text box and send button -->
                        <div class="input-container">
                            <textarea class="text-box" id="chatInput" placeholder="Ask a question..." rows="1"></textarea>
                            <button class="send-button" onclick="sendMessage()">→</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right column for Topics and Upcoming Tasks -->
            <div class="right-container">
                <div class="child">
                    <div class="child-header">Topics</div>
                    <div class="child-content"></div>
                </div>

                <div class="child">
                    <div class="child-header">Upcoming Tasks</div>
                    <div class="child-content"></div>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="javascripts/script.js"></script>

</html>
